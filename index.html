<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>AI Stress Detection System</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet">

    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body id="dashboardPage">

    <header>
      <h1>AI Stress Monitor</h1>

      <div class="headerRight">

        <span id="fps">FPS: 0</span>

        <button id="themeBtn">
          <i class="ri-sun-line"></i>
        </button>

        <button id="logoutBtn">
          Logout
        </button>

      </div>
    </header>

    <div class="dashboard">

      <!-- CAMERA PANEL -->
      <div class="cameraPanel">

        <div class="cameraFrame">
          <video
            id="video"
            autoplay
            playsinline></video>

          <canvas id="canvas"></canvas>
        </div>

        <div class="controls">

          <button onclick="startCamera()">
            Start
          </button>

          <button onclick="stopCamera()">
            Stop
          </button>

          <button onclick="resetData()">
            Reset
          </button>

        </div>

      </div>

      <!-- STATUS PANEL -->
      <div class="statusPanel">

        <h3>Status</h3>

        <p id="emotionText">
          Waiting
        </p>

        <div id="emoji">
          🙂
        </div>

        <h4>Blinks</h4>

        <p id="blinkCount">
          0
        </p>

        <h4>Stress</h4>

        <div class="gauge">

          <div class="gaugeBody">

            <div
              class="gaugeFill"
              id="gaugeFill"></div>

            <div class="gaugeCover">
              <span id="gaugeText">
                0%
              </span>
            </div>

          </div>

        </div>

      </div>

      <!-- GRAPH PANEL -->
      <div class="graphPanel">

        <h3>Stress Graph</h3>

        <canvas id="stressChart"></canvas>

      </div>

      <!-- HISTORY PANEL -->
      <div class="historyPanel">

        <h3>Stress History</h3>

        <table id="historyTable">

          <tr>
            <th>Time</th>
            <th>Stress %</th>
          </tr>

        </table>

      </div>

    </div>

    <!-- FOOTER -->
    <footer>

      <div class="footerLeft">
        AI Stress Detection System
      </div>

      <div class="footerRight">
        © 2026
      </div>

    </footer>

    <script src="script.js"></script>
    <script src="form.js"></script>

  </body>
</html>
